<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171c1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Elementia">
  <meta name="description" content="Elementia: The Return — classic Elements-inspired iPhone interface and battlefield preview.">
  
  
  <style>
:root {
  color-scheme: dark;
  --bg:#161b1c; --bg-hi:#273032; --wood:#202729; --wood2:#14191b;
  --gold:#d7b76b; --gold-soft:#9b8452; --cream:#ede1bd; --muted:#a6a998;
  --line:#796744; --line-soft:#504b3c; --green:#8dbb87; --danger:#d98b78;
  --font-title: Georgia,'Times New Roman',serif; --font-ui: Georgia,'Times New Roman',serif;
}
* { box-sizing:border-box; }
html { min-height:100%; background:var(--bg); scroll-behavior:smooth; }
body { margin:0; font-family:var(--font-ui); color:var(--cream); min-height:100dvh; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
body::before{content:"";z-index:-2;position:fixed;inset:0;background:radial-gradient(ellipse at 50% -15%,#434139 0%,transparent 54%),repeating-linear-gradient(91deg,transparent 0 8px,#00000010 9px 10px,transparent 13px 31px),repeating-linear-gradient(178deg,#23282a 0 4px,#1b2224 5px 40px,#1f2526 43px 70px); }
body::after{content:"";z-index:-1;pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 38%,#0009 110%)}
button,input,select { font:inherit; }
button { cursor:pointer; touch-action:manipulation; }
button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid #ffdf83; outline-offset:3px; }
button:disabled { opacity:.35;cursor:not-allowed; }
button:active:not(:disabled){ transform:translateY(1px) }
#app{ min-height:100dvh; }
.shell { max-width:1190px; margin:0 auto; padding:12px 15px max(28px,env(safe-area-inset-bottom)); }
.ornament-line{height:2px;background:linear-gradient(90deg,transparent,var(--gold-soft) 15%,var(--gold) 50%,var(--gold-soft) 85%,transparent);opacity:.75}
.topbar { display:flex; flex-wrap:wrap; align-items:center;gap:10px; justify-content:space-between; min-height:64px; }
.brand { display:flex; align-items:center; gap:11px; padding:4px 0; background:none; border:0; text-align:left; color:inherit; }
.brandcrest{width:35px;height:35px;border:1px solid var(--gold-soft);transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 0 0 3px #0006 inset;flex:0 0 35px; }
.brandcrest span { transform:rotate(-45deg);font-size:25px;color:var(--gold);line-height:1; }
.brandname { display:block;letter-spacing:.16em;font-size:20px;line-height:1;color:var(--gold);text-shadow:1px 2px #000; }
.brandsub { display:block;font:9px Arial,sans-serif;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin-top:5px; }
.nav { display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:flex-end; }
.nav-button { background:#0c1112aa;border:1px solid #67583a;color:#d4c59e;padding:9px 13px;min-height:40px;min-width:55px;border-radius:2px;font-size:12px;letter-spacing:.035em; }
.nav-button[aria-current="page"]{background:linear-gradient(#6b5633,#32271b);color:#fff0be;border-color:#d0ad67;}
.panel{background:linear-gradient(155deg,#2f3535e8,#1a2022f6 40%,#161a1beb);border:1px solid var(--line);box-shadow:inset 0 0 0 3px #0e1112,0 8px 24px #0007;padding:15px;min-width:0;}
.panel-inner{border:1px solid #514936;padding:14px;background:linear-gradient(135deg,#111719aa,#242a2a44);}
.label { font:10px Arial,sans-serif;text-transform:uppercase;letter-spacing:.19em;color:#c3b183; }
.section-title { margin:0 0 14px; font:normal 25px var(--font-title);letter-spacing:.03em;color:var(--gold);text-shadow:0 2px #000; }
.section-title.small{font-size:21px;margin-bottom:8px;}
.page-title{display:flex;align-items:end;justify-content:space-between;gap:8px; margin:18px 0 16px;border-bottom:1px solid #625638;padding-bottom:9px;}
.page-title h1{font:normal 28px var(--font-title);color:var(--gold);margin:0;letter-spacing:.04em;}
.page-title p{color:var(--muted);margin:4px 0 0;font:12px Arial,sans-serif;line-height:1.5}
.button { min-height:43px;border-radius:3px;border:1px solid #d7bc80;background:linear-gradient(#867453 0%,#423b2d 45%,#232b2b 100%);box-shadow:inset 0 1px #fff5bd65,0 3px 9px #0007;color:#fff5d7;text-shadow:0 1px 1px #000;font-size:15px;letter-spacing:.025em;padding:10px 16px;white-space:normal;}
.button.secondary{background:linear-gradient(#525c5b,#293131 45%,#171c1e);border-color:#83918d;color:#e2e4db;}
.button.quiet{background:#13171990;border-color:#62563b;color:var(--cream);box-shadow:none}
.button.danger{border-color:#986850;color:#eac4af}
.button.wide{width:100%}
.button.mini{font-size:12px;padding:7px 10px;min-height:35px;}
.linklike{color:#f2d487;border:0;background:none;text-decoration:underline;text-underline-offset:3px;padding:7px}
.muted{color:var(--muted)}
.rule{height:1px;background:linear-gradient(90deg,transparent,#847350,transparent);margin:15px 0;}
.eyebrow{font:10px Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#b7aa8c}
.login{display:grid;place-items:center;min-height:calc(100dvh - 30px);padding:24px 10px 46px;}
.login-card {width:min(520px,100%);text-align:center;padding:26px 22px 20px;position:relative;}
.login-sigil{font-size:66px;line-height:1.1;color:#a9975c;opacity:.46;text-shadow:0 3px 14px #000;}
.hero-title{font-weight:normal;margin:12px 0 3px;color:#edd58d;font-size:clamp(42px,9vw,67px);letter-spacing:.095em;text-shadow:0 2px 0 #422d1b,0 0 18px #b2883b55;}
.hero-sub{letter-spacing:.44em;text-transform:uppercase;font:11px Arial,sans-serif;color:#c6b179;margin:0 0 30px;}
.field{display:block;text-align:left;margin:0 0 15px;}
.field span{display:block;font-size:12px;color:var(--gold);margin-bottom:6px;}
.field input,.field select,.search-input{border:1px solid #6c674e;border-radius:2px;background:#101718;color:#f5ecd0;padding:12px 13px;min-height:43px;width:100%;font-size:16px;outline-offset:1px;}
.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 0;}
.notice { font:12px/1.55 Arial,sans-serif;color:#b6b9b1; }
.notice strong{color:#efdbab}
.notice-box{border:1px solid #66553a;background:#0b1011a6;padding:12px 14px;line-height:1.55;margin-top:15px;font:12px Arial,sans-serif;color:#d9c9a8;}
.hero-menu{display:grid;grid-template-columns:1.12fr 1fr .95fr;gap:15px;align-items:stretch}
.hero-panel{min-height:380px;display:flex;flex-direction:column}
.menu-crest{height:195px;display:grid;place-items:center;position:relative;}
.menu-crest::before{content:"";position:absolute;width:167px;height:167px;border:2px solid #8b7647;border-radius:50%;box-shadow:0 0 0 9px #0006,0 0 0 10px #77704966,0 0 0 22px #20282a;}
.menu-crest::after{content:"";position:absolute;width:117px;height:117px;border:1px dashed #c6ae72;border-radius:50%;}
.menu-crest .rune{font:72px Georgia,serif;color:#e2c778;z-index:1;text-shadow:0 0 13px #d9bb675b;}
.menu-crest .rune-sub{position:absolute;bottom:7px;color:#aa9d79;font:10px Arial,sans-serif;letter-spacing:.2em;}
.menu-stat{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid #443f34;padding:12px 3px;gap:12px;}
.menu-stat b{color:#e9d296;font-weight:normal;}
.action-stack{display:grid;gap:10px;margin-top:10px;}
.action-stack .button{text-align:left;}
.action-stack .button small{display:block;color:#cec7b6;font:10px Arial,sans-serif;margin-top:2px;}
.menu-foot{margin-top:auto;padding-top:15px;font:11px Arial,sans-serif;color:#9fa99f;line-height:1.6;}
.element-ring{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:17px 0 12px;}
.element-choice {display:grid;place-items:center;gap:4px;background:#111718;border:1px solid #5a5142;padding:9px 2px;min-height:59px;color:#dfdbc9;}
.element-choice[aria-pressed="true"]{border-color:#dcc278;box-shadow:inset 0 0 0 1px #a08950;background:#333b38;}
.element-choice .orb{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 1px 5px #fff6,0 0 0 1px #ffffff33;}
.element-choice small{font:10px Arial,sans-serif;color:#d1c9b1;}
.utility-strip{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin:16px 0 0;font-size:11px;color:#aca895;}
.utility-strip strong{color:#dbc781;font-weight:normal}
.deck-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(285px,.9fr);gap:15px;align-items:start;}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px;}
.toolbar .search-input{flex:1 1 190px;min-width:0;}
.filter-select{background:#111718;border:1px solid #777052;color:#e4d8b9;font-size:13px;min-height:43px;max-width:150px;padding:0 8px;}
.card-collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px;}
.card-tile{position:relative;min-width:0;background:linear-gradient(150deg,#3b3a2e,#131c1f 60%);border:1px solid #84714b;padding:4px;min-height:183px;color:var(--cream);text-align:left;box-shadow:0 3px 7px #0008;}
.card-tile:disabled{opacity:.55}
.card-tile:hover,.card-tile:focus-visible{border-color:#dfcc89;}
.card-tile.selected{outline:2px solid #e3c575;outline-offset:1px;}
.card-tile .card-in{display:flex;flex-direction:column;border:1px solid #67593d;height:100%;background:#1a2427;}
.card-name{min-height:31px;font:12px/1.12 Georgia,serif;text-align:center;display:grid;place-items:center;padding:3px 4px;background:#242b2d;border-bottom:1px solid #5e553f;}
.card-art{height:96px;background:radial-gradient(circle at 40% 38%,var(--accent),transparent 66%),linear-gradient(125deg,#2f3d3d,#111b20 70%);display:grid;place-items:center;position:relative;overflow:hidden;}
.card-art::before {content:"";width:65px;height:65px;position:absolute;border:1px solid #ffffff55;transform:rotate(45deg);box-shadow:0 0 0 8px #0002,0 0 0 11px #ffffff13;}
.card-art span{position:relative;color:#f9f6e5;text-shadow:0 2px 7px #000,0 0 15px var(--accent);font-size:43px;}
.card-art .card-up {position:absolute;right:3px;top:3px;background:#c1a767;color:#161a1a;padding:2px 3px;font:8px Arial,sans-serif;}
.card-bottom{display:flex;justify-content:space-between;gap:2px;align-items:center;border-top:1px solid #6d644c;padding:5px;color:#c6ba94;font:10px Arial,sans-serif;min-height:31px;}
.card-count{position:absolute;top:-7px;right:-7px;background:#111719;border:1px solid #d2bd81;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font:12px Arial,sans-serif;color:#f3dfaa;}
.selected-detail{background:#101718a6;border:1px solid #5e5138;padding:10px;margin-top:13px;}
.detail-row{display:grid;grid-template-columns:82px 1fr;gap:13px;align-items:start;}
.detail-row .card-tile{min-height:148px}.detail-row .card-art{height:79px}.detail-row .card-name{min-height:25px}
.detail-row h3{margin:0 0 6px;color:var(--gold);font-size:20px;font-weight:normal;}
.detail-row p{margin:4px 0 9px;color:#bbc1b5;line-height:1.4;font:12px Arial,sans-serif;}
.deck-list{display:grid;gap:7px;max-height:420px;overflow:auto;margin:10px 0 13px;}
.deck-line{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 9px;border:1px solid #504838;background:#141a1baa;}
.deck-line .name{display:block;font-size:13px;color:#e5dabc;}
.deck-line small{font:10px Arial,sans-serif;color:#aeb8b2;}
.deck-line .actions{display:flex;align-items:center;gap:5px;}
.count{color:#f2d88e;min-width:25px;text-align:center;}
.square-button{width:35px;height:35px;border:1px solid #897650;background:#293231;color:#eed8a1;font-size:18px;}
.tip{font:11px/1.6 Arial,sans-serif;color:#a8b1ad}
.shop-layout{display:grid;grid-template-columns:1fr 280px;gap:15px;align-items:start;}
.shop-credit{font-size:18px;color:#e6cd82;text-align:right;}
.shop-credit small{display:block;font:10px Arial,sans-serif;color:#b3b5a4;letter-spacing:.15em;}
.shop-card-text{font:12px/1.5 Arial,sans-serif;color:#c0c1b3;}
.shop-summary{position:sticky;top:12px;}
.shop-summary .card-tile{max-width:200px;margin:8px auto 16px;width:100%;height:245px;}
.shop-summary .card-tile .card-art{height:150px}
.battle-page{max-width:1360px;}
.battle-layout{display:grid;grid-template-columns:minmax(0,1fr) 182px;gap:12px;align-items:start;}
.battle-arena{padding:12px;}
.battle-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.health{display:flex;align-items:center;gap:9px;font-size:13px;color:#e0d5b9;}
.health .bar{display:inline-block;background:#1b221e;width:99px;height:10px;border:1px solid #817858;box-shadow:inset 0 2px 3px #000;overflow:hidden;}
.health .bar i{display:block;background:linear-gradient(90deg,#418855,#add775);height:100%;width:100%;}
.field-zone{min-height:159px;display:flex;flex-direction:column;gap:8px;border:1px solid #4d4f45;background:linear-gradient(155deg,#1b2326a9,#171d1d8a);padding:10px;}
.field-zone.player{background:linear-gradient(155deg,#1c292783,#121b1c8c)}
.zone-title {font:10px Arial,sans-serif;text-transform:uppercase;letter-spacing:.17em;color:#aaaf9e;display:flex;justify-content:space-between;}
.zoneslots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;flex:1;min-height:96px;}
.slot{border:1px solid #6e665161;background:#1016178c;min-width:0;display:grid;place-items:center;position:relative;min-height:85px;color:#696956;font-size:22px;}
.slot::after{content:"";position:absolute;inset:4px;border:1px solid #ffffff10;pointer-events:none;}
.slot .slotcard{width:100%;height:100%;position:relative;display:flex;flex-direction:column;justify-content:space-between;text-align:center;background:radial-gradient(circle at 50% 25%,var(--accent),#192426 72%);border:1px solid #9c875a;padding:4px 1px;min-height:83px;overflow:hidden;}
.slotcard .symbol{font-size:26px;text-shadow:0 2px 4px #000;}
.slotcard .slotname{font:9px/1.2 Georgia,serif;color:#fff0ce;overflow:hidden;}
.mid-separator{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;color:#c1a876;font:12px Georgia,serif;}
.mid-separator::before,.mid-separator::after{content:"";height:1px;background:#7e6c48;flex:1;}
.hand-area{margin-top:10px;border-top:1px solid #5b503a;padding-top:12px;}
.hand-row{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 3px 12px;scrollbar-color:#9a8249 #161b1c;}
.hand-row .card-tile{flex:0 0 112px;scroll-snap-align:start;min-height:160px;}
.hand-row .card-art{height:75px}
.hand-row .card-name{font-size:11px;min-height:30px;}
.battle-side{display:grid;gap:12px;}
.battle-side .panel{padding:11px;}
.resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
.resource{display:flex;align-items:center;gap:5px;background:#101719;border:1px solid #49473d;border-radius:3px;padding:4px;min-width:0;font:12px Arial,sans-serif;color:#efe5c9;}
.resource-orb{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 24px;color:#fff5de;text-shadow:0 1px #000;}
.resource span:last-child{margin-left:auto;padding-right:2px;}
.sandbox-label{display:inline-block;font:10px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;border:1px solid #bfa365;padding:5px 7px;color:#ead6a3;background:#211d14;}
.battle-log{border:1px solid #5e553f;background:#111718;padding:9px;color:#d5d0bb;font:12px/1.45 Arial,sans-serif;min-height:42px;}
.overlay{position:fixed;inset:0;z-index:40;background:#000b;display:grid;place-items:center;padding:16px;}
.modal{width:min(410px,100%);max-height:90dvh;overflow:auto;box-shadow:0 14px 45px #000d;}
.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:15px;flex-wrap:wrap;}
.footer { margin:22px 0 0;text-align:center;font:11px/1.5 Arial,sans-serif;color:#9c988a;padding:11px 0 6px; }
.footer a{color:#dac280;}
.empty{padding:24px 10px;text-align:center;color:#aab4a7;font:13px Arial,sans-serif;border:1px dashed #555343;}
.mobile-switch{display:none;}
.sr-only{position:absolute!important;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;}
@media(max-width:850px){.hero-menu{grid-template-columns:1fr 1fr}.hero-menu .hero-panel:last-child{grid-column:1/-1;min-height:0}.hero-panel{min-height:310px}.shop-layout{grid-template-columns:1fr 225px}.battle-layout{grid-template-columns:1fr}.battle-side{grid-template-columns:1fr 1fr}.battle-side .panel:last-child{grid-column:1/-1}.resource-grid{grid-template-columns:repeat(6,1fr)}.resource{justify-content:center;flex-direction:column}.resource span:last-child{margin-left:0} }
@media(max-width:650px){
 .shell{padding:8px 10px max(22px,env(safe-area-inset-bottom));}
 .topbar{align-items:center;gap:8px;padding-bottom:10px}.brandname{font-size:18px}.brandcrest{width:29px;height:29px;flex-basis:29px}.brandcrest span{font-size:21px}.nav{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.nav-button{padding:7px 3px;font-size:11px;min-width:0;min-height:39px}
 .page-title{margin:14px 0 12px}.page-title h1{font-size:25px}.page-title p{font-size:11px}
 .hero-menu{grid-template-columns:1fr}.hero-menu .hero-panel:last-child{grid-column:auto}.hero-panel{min-height:auto}.menu-crest{height:163px}.menu-crest::before{width:135px;height:135px}.menu-crest::after{width:93px;height:93px}.menu-crest .rune{font-size:56px}
 .panel{padding:12px}.section-title{font-size:23px}
 .deck-layout,.shop-layout{display:block}.deck-layout>.panel,.shop-layout>.panel{margin-bottom:12px}
 .mobile-switch{display:flex;margin:0 0 11px;gap:6px}.mobile-switch .button{flex:1;font-size:13px;}
 .deck-layout .hide-mobile{display:none}.shop-summary{position:static}.shop-summary .card-tile{max-width:170px;height:220px}.shop-summary .card-tile .card-art{height:125px}
 .card-collection{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card-tile{min-height:164px}.card-art{height:82px}.card-name{font-size:11px}.card-bottom{font-size:9px}
 .battle-side{grid-template-columns:1fr 1fr;gap:8px}.battle-side .panel{padding:9px}
 .resource-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.resource{flex-direction:row;justify-content:flex-start}.resource span:last-child{margin-left:auto}
 .battle-arena{padding:8px}.field-zone{min-height:118px;padding:7px}.zoneslots{gap:3px;min-height:73px}.slot{min-height:69px}.slot .slotcard{min-height:67px;padding:2px 0}.slotcard .symbol{font-size:19px}.slotcard .slotname{font-size:8px}.zone-title{font-size:9px}
 .hand-row .card-tile{flex-basis:103px;min-height:142px}.hand-row .card-art{height:62px}
 .battle-meta{font-size:11px}.health .bar{width:55px}
 .login{min-height:100dvh}.login-card{padding:22px 17px}.hero-title{font-size:clamp(38px,11vw,58px)}
}
@media(max-width:380px){.resource-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card-collection{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-title{font-size:37px}.hero-sub{letter-spacing:.3em}}
@media(orientation:landscape) and (max-height:510px){.shell{padding-top:5px}.topbar{min-height:42px}.field-zone{min-height:102px}.zoneslots{min-height:61px}.slot{min-height:62px}.slot .slotcard{min-height:61px}.login{min-height:unset}.login-sigil{font-size:30px}.hero-title{font-size:40px;margin:3px 0}.hero-sub{margin-bottom:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}


/* BOARD V2 — classic Elements tabletop. This is a UI sandbox, NOT a combat engine. */
.battle-page{max-width:1280px;padding-bottom:24px}
.battle-page .page-title{margin:8px 0 9px}
.battle-page .page-title h1{font-size:clamp(20px,3vw,31px)}
.battle-page .page-title p{font-size:11px}
.etg-frame{border:3px ridge #988454;background:#0e1515;box-shadow:0 15px 55px #000b,0 0 0 1px #060909 inset;padding:6px;overflow:hidden}
.etg-arena{display:grid;grid-template-columns:72px minmax(0,1fr) 159px;grid-template-areas:'quanta field hand';gap:6px;min-height:435px;align-items:stretch}

      <div class="etg-inspect-actions"><button class="button" data-action="inspect-hand" ${card?'':'disabled'}>Inspect card</button><button class="button" data-action="play-hand" ${card?'':'disabled'}>${card?(card.type==='Spell'?'Show spell':'Place card'):'Select card'}</button></div>
      <button class="button secondary" data-action="end-turn">End Turn →</button></div>
    <div class="etg-log" role="status">${esc(b.log)}</div>
    <div class="etg-actions" style="grid-template-columns:1fr auto auto"><div class="etg-selection"><small>Classic board display: simulated card placement only. Quanta, card costs, AI, and combat still require the approved gameplay engine.</small></div><button class="button quiet" data-action="reset-duel">Reset board</button><button class="button quiet" data-action="navigate" data-to="menu">Main menu</button></div>`,true);
  }
  function modal(){const c=BY_ID[state.modal];if(!c)return '';return `<div class="overlay" role="presentation" data-action="close-modal"><section class="panel modal" role="dialog" aria-modal="true" aria-label="Card details"><h2 class="section-title">Card Details</h2>${renderDetail(c)}
    <div class="modal-actions"><button class="button secondary" data-action="close-modal">Close</button><button class="button" data-action="add-deck" data-id="${esc(c.id)}" ${(state.deck[c.id]||0)>=(state.inventory[c.id]||0)?'disabled':''}>Add to Deck</button></div></section></div>`;}
  function render(){
    root.innerHTML=state.scene==='login'?renderLogin():state.scene==='menu'?renderMenu():state.scene==='deck'?renderDeck():state.scene==='shop'?renderShop():renderDuel();
    document.title=`${state.scene==='login'?'Welcome':state.scene.charAt(0).toUpperCase()+state.scene.slice(1)} — Elementia: The Return`;
  }
  function enter(name){state.player=(name||'Guest').trim().slice(0,24)||'Guest';state.scene='menu';save();render();}
  function navigate(to){if(!['menu','deck','shop','duel','login'].includes(to))return;if(to==='duel'&&(!state.duel||state.duel.version!==3))state.duel=newDuel();state.scene=to;state.notice='';render();window.scrollTo({top:0,behavior:'instant'});}
  function changeDeck(id,delta){if(!BY_ID[id])return;const current=state.deck[id]||0;
    if(delta>0 && (current>=(state.inventory[id]||0)||countMap(state.deck)>=60)){state.notice='No available copies or the deck has reached 60 cards.';return;}
    state.deck[id]=Math.max(0,current+delta);state.duel=null;save();}
  function buy(id){const c=BY_ID[id];if(!c)return;if(state.credits<c.price){state.notice='Not enough demo electrum.';return;}
    state.credits-=c.price;state.inventory[id]=(state.inventory[id]||0)+1;state.notice=`Added one ${c.name} to your local collection.`;save();}
  function playHand(){
    const b=ensureBoard(),i=b.selectedHand;if(i==null||i<0||i>=b.hand.length)return;
    const id=b.hand[i],c=BY_ID[id];if(!c)return;
    if(c.type==='Spell'){
      b.log=`${c.name}: spell display preview only; no targeting, cost, damage, or ability effect.`;
    }else if(c.type==='Weapon'||c.type==='Shield'){
      b['player'+c.type]=id;b.log=`${c.name} placed into your ${c.type.toLowerCase()} equipment slot (visual only).`;
    }else{
      const kind=demoZone(c.type),slots=b['player'+kind];
      const first=slots.findIndex(x=>!x);
      if(first===-1){b.log=`All ${kind.toLowerCase()} preview slots are occupied.`;render();return;}
      slots[first]=id;
      b.log=`${c.name} displayed in your ${kind.toLowerCase()} slot ${first+1}; no quanta spent.`;
    }
    b.hand.splice(i,1);b.selectedHand=-1;render();
  }
  function endTurn(){const b=ensureBoard();b.turn++;b.selectedHand=-1;
    if(b.library.length&&b.hand.length<8)b.hand.push(b.library.shift());
    b.log=`Round ${b.turn}. Layout preview advanced; no AI, attack, or automated quanta was applied.`;
    render();
  }
  root.addEventListener('submit',(event)=>{if(event.target?.id==='entry-form'){event.preventDefault();enter(document.getElementById('playername').value);}});
  root.addEventListener('click',(event)=>{
    const button=event.target.closest('[data-action]');if(!button)return;
    if(button.classList.contains('overlay') && event.target!==button)return;
    const action=button.dataset.action,id=button.dataset.id;
    switch(action){
      case 'guest':enter('Guest');break;
      case 'navigate':navigate(button.dataset.to);break;
      case 'element':if(ELEMENT[id]){state.element=id;save();render();}break;
      case 'deck-tab':state.deckTab=id;render();break;
      case 'select-card':if(BY_ID[id]){state.selected=id;state.notice='';render();}break;
      case 'detail':if(BY_ID[id]){state.modal=id;render();}break;
      case 'close-modal':state.modal=null;render();break;
      case 'add-deck':changeDeck(id,1);render();break;
      case 'remove-deck':changeDeck(id,-1);render();break;
      case 'buy':buy(id);render();break;
      case 'reset-duel':state.duel=newDuel();navigate('duel');break;
      case 'hand-card':if(state.duel){state.duel.selectedHand=Number(id);render();}break;
      case 'inspect-hand':if(state.duel?.selectedHand>=0){const cardId=state.duel.hand[state.duel.selectedHand];if(BY_ID[cardId]){state.modal=cardId;render();}}break;
      case 'play-hand':playHand();break;
      case 'end-turn':endTurn();break;
    }
  });
  root.addEventListener('change',e=>{
    if(e.target.id==='deck-filter'){state.filter=e.target.value;render();}
    if(e.target.id==='shop-filter'){state.shopFilter=e.target.value;const visible=filterCards('shop');if(visible.length&&!visible.some(c=>c.id===state.selected))state.selected=visible[0].id;render();}
  });
  root.addEventListener('input',e=>{
    if(e.target.id==='card-search'){const value=e.target.value;state.search=value;render();const box=document.getElementById('card-search');if(box){box.focus();box.setSelectionRange(value.length,value.length);}}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();}});
  window.ElementiaInterface = Object.freeze({
    version:'3.0.0-classic-board-preview',isDemo:demo,
    navigate:scene=>navigate(scene),
    getSnapshot:()=>({player:state.player,mark:state.element,deck:{...state.deck},inventory:{...state.inventory}})
  });
  render();
})();

</script>
</body>
</html>
